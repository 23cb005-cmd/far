# Minimal SPA server: serve the Vite build, falling back to index.html so
# client-side routes (react-router) resolve on a hard refresh/deep link.
#
# /api/ is reverse-proxied to the server container so the browser only ever
# talks to one origin - the same reason the dev-time Vite proxy in
# client/vite.config.ts exists: SameSite=strict cookies need a single origin.
# FARMFAIR_API_UPSTREAM is templated in by docker-compose.prod.yml via
# nginx's built-in envsubst entrypoint (nginx:1.27-alpine runs it
# automatically on *.conf files under /etc/nginx/templates).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass ${FARMFAIR_API_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
