<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FarmFair - know the real mandi price and sell your crop at a fair price. Built for Tamil Nadu farmers and buyers."
    />
    <meta name="theme-color" content="#166534" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Inter for Latin, Noto Sans Tamil for Tamil. Preconnect first so the font
      request starts before the CSS is parsed, and `display=swap` so text is
      readable immediately on a slow rural connection.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>FarmFair - Know the real price. Sell at a fair price.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
